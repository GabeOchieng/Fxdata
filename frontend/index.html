<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaziHub — Kenya's Gig Economy Platform</title>
<meta name="description" content="KaziHub connects Kenya's informal-sector professionals — fundis, mama fuas, chefs, drivers, tutors and more — with the people who need them.">
<link rel="canonical" href="kazihub-home.html">
<meta http-equiv="refresh" content="0; url=kazihub-home.html">
<style>
  html,body{margin:0;height:100%;background:#04060e;color:#f0eee8;
    font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;padding:24px;}
  .dot{width:10px;height:10px;border-radius:50%;background:#00e5ff;
    box-shadow:0 0 12px #00e5ff;animation:p 1.6s ease-in-out infinite;}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  .logo{font-size:34px;font-weight:800;letter-spacing:-.5px;}
  .logo em{color:#00e5ff;font-style:normal;}
  a{color:#00e5ff;font-weight:600;text-decoration:none;}
  a:hover{text-decoration:underline;}
  p{color:#9a98b5;font-size:14px;margin:0;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <div class="logo">Kazi<em>Hub</em></div>
    <p>Loading Kenya's gig economy platform…</p>
    <p>If you are not redirected, <a href="kazihub-home.html">enter KaziHub</a>.</p>
  </div>
</body>
</html>

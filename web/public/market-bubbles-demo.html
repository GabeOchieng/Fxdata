<title>KaziHub — Skills Market</title>
<style>
  :root{
    --bg:#010206; --bg2:#080d1a; --panel:rgba(255,255,255,.04);
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --fg:#f0eee8; --muted:#9a98b5; --faint:#5b5f7d; --gold:#ffbe00;
    --cyan:#00e5ff; --green:#00ffb3;
    --sans:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}

  header{position:sticky;top:0;z-index:40;background:rgba(1,2,6,.85);
    backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:16px;padding:10px clamp(12px,4vw,26px)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.4px}
  .logo b{color:var(--cyan)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 9px var(--cyan);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  .nstats{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
  .nstats b{color:var(--fg)} .nstats .lv{color:#00ff88}
  @media(max-width:620px){.nstats{display:none}}

  /* ticker */
  .tick{overflow:hidden;border-bottom:1px solid var(--line);background:rgba(8,13,26,.6);padding:6px 0}
  .tick-in{display:flex;gap:34px;white-space:nowrap;width:max-content;animation:marq 70s linear infinite}
  .ti{font-family:var(--mono);font-size:11px;color:var(--muted)} .ti b{color:var(--fg);font-weight:600}
  .up{color:#00ffb3}.dn{color:#ff3d5a}
  @keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* controls */
  .controls{padding:14px clamp(12px,4vw,26px) 6px;display:flex;flex-direction:column;gap:10px}
  .search{position:relative;max-width:360px;width:100%}
  .search input{width:100%;padding:10px 12px 10px 36px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--fg);font:14px var(--sans);outline:none;transition:border-color .15s}
  .search input:focus{border-color:rgba(0,229,255,.55)}
  .search input::placeholder{color:var(--faint)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .pills::-webkit-scrollbar{height:5px}.pills::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
  .cf{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;
    border:1px solid var(--line);background:rgba(8,13,26,.7);color:var(--muted);
    border-radius:99px;padding:5px 11px;font:600 11px var(--sans);transition:all .14s}
  .cf:hover{color:var(--fg);border-color:var(--line2)}
  .cf.on{border-color:transparent;color:#04070f}
  .cf .cfd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .cf[data-cat="all"] .cfd{display:none}

  /* stage */
  .stage{position:relative;flex:1;margin:8px clamp(12px,4vw,26px) 0;border:1px solid var(--line);
    border-radius:18px;overflow:hidden;background:rgba(1,2,6,.9);min-height:clamp(440px,66vh,820px);
    touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-tap-highlight-color:transparent}
  .hint{padding:9px clamp(12px,4vw,26px) 18px;text-align:center;color:var(--faint);font-size:12px}

  /* tooltip */
  .tt{position:fixed;z-index:60;pointer-events:none;min-width:210px;max-width:250px;
    background:rgba(8,13,26,.96);border:1px solid var(--line2);border-radius:14px;padding:13px 15px;
    box-shadow:0 16px 48px rgba(0,0,0,.8);backdrop-filter:blur(16px);opacity:0;transition:opacity .1s}
  .tt.show{opacity:1}
  .tt-n{font-size:14px;font-weight:700}
  .tt-c{font-size:10px;color:var(--muted);margin:2px 0 10px}
  .tt-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
  .tt-row span:last-child{font-weight:600;font-family:var(--mono)}
  .tt-pl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:9px 0 4px}
  .tt-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
  .tt-fill{height:100%;border-radius:2px}
  .tt-lv{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
    font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:8px;border:1px solid}

  /* modal */
  .mbg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;padding:16px}
  .mbg.open{opacity:1;pointer-events:auto}
  /* cryptobubbles-style detail card */
  .cbcard{background:#0b0f1c;border:1px solid var(--line2);border-radius:16px;width:min(880px,96vw);
    max-height:92vh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(14px);
    transition:transform .2s;box-shadow:0 30px 90px rgba(0,0,0,.7)}
  .mbg.open .cbcard{transform:none}
  .cbhead{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
  .cbicon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .cbname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cbprice{margin-left:auto;font-size:14px;font-weight:700;font-family:var(--mono)}
  .cbtick{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .cbx{background:none;border:0;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 4px;line-height:1}
  .cbtabs{display:flex;padding:0 14px;border-bottom:1px solid var(--line);flex-shrink:0}
  .cbtab{padding:11px 2px;margin-right:22px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .12s}
  .cbtab:hover{color:var(--fg)} .cbtab.on{color:var(--cyan);border-bottom-color:var(--cyan)}
  .cbbody{overflow-y:auto;padding:14px}
  .cbgrid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:720px){.cbgrid{grid-template-columns:minmax(0,300px) 1fr}}
  .conv{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .conv .cell{flex:1;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .conv .cell .k{color:var(--muted);font-size:11px}
  .conv .cell .v{font-family:var(--mono);font-weight:600;font-size:13px}
  .conv .eq{color:var(--muted);font-size:13px}
  .tfrow{display:flex;gap:6px;margin-bottom:12px}
  .tf{flex:1;border:1px solid transparent;border-radius:8px;padding:7px 3px;text-align:center;cursor:pointer;background:rgba(255,255,255,.02)}
  .tf .tk{font-size:11px;color:var(--muted)} .tf .tv{font-size:12px;font-weight:700;margin-top:2px}
  .promo{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;
    cursor:pointer;background:linear-gradient(90deg,rgba(0,229,255,.06),transparent)}
  .promo .pi{width:26px;height:26px;border-radius:7px;background:rgba(0,229,255,.12);display:flex;align-items:center;justify-content:center;font-size:14px}
  .promo .pt{font-size:12px;font-weight:700}.promo .ps{font-size:10px;color:var(--muted)}.promo .pa{margin-left:auto;color:var(--muted)}
  .srow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .srow .sl{color:var(--muted)} .srow .sv{font-weight:600;font-family:var(--mono)}
  .iconrow{display:flex;gap:6px}
  .iconrow span{width:22px;height:22px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px}
  .chartwrap{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.28);padding:10px 12px;display:flex;flex-direction:column}
  .chart-top{display:flex;justify-content:flex-end;font-size:10px;font-family:var(--mono)}
  .chart svg{width:100%;height:210px;display:block}
  .chart-x{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);font-family:var(--mono);margin-top:4px}
  .wcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
  @media(max-width:520px){.wcards{grid-template-columns:1fr}}
  .wcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:all .15s}
  .wcard:hover{border-color:var(--cyan);transform:translateY(-2px)}
  .wc-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;color:#04070f;margin-bottom:8px}
  .wc-name{font-size:12px;font-weight:600}.wc-loc{font-size:10px;color:var(--muted);margin:2px 0 5px}
  .wc-stars{font-size:11px;color:var(--gold);margin-bottom:5px}
  .wc-chip{display:inline-flex;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:700;border:1px solid;
    text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
  .wc-wa{font-size:11px;font-weight:600;color:#25d366;margin-top:6px}
  .areas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  @media(max-width:520px){.areas{grid-template-columns:1fr}}
  .arow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px}
  .arow .ab{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
  .arow .af{height:100%;border-radius:9px}
  .arow .av{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .join{background:linear-gradient(135deg,rgba(0,255,179,.08),rgba(255,190,0,.04));
    border:1px solid rgba(0,255,179,.15);border-radius:14px;padding:18px;text-align:center;margin-top:6px}
  .join h4{margin:0 0 6px;font-size:15px}.join p{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.55}
  .btnp{background:var(--cyan);color:#04070f;border:0;border-radius:9px;padding:9px 16px;font:700 12px var(--sans);cursor:pointer}
  @media (prefers-reduced-motion: reduce){.dot,.tick-in{animation:none}}
</style>

      ctx.beginPath();ctx.arc(vx,H,18+b.r*0.3,0,6.2832);ctx.fillStyle=vg;ctx.fill();});
    BUBBLES.forEach(function(b){
      if(b===dragB)return;

    if(act&&act.dataset.act==='close'){mbg.classList.remove('open');return;}
    if(t){cardTab=t.dataset.tab;renderCard();return;}
    if(tf){cardTf=parseInt(tf.dataset.tf,10);renderCard();return;}
  });
  mbg.addEventListener('click',function(e){if(e.target===mbg)mbg.classList.remove('open');});
  window.addEventListener('keydown',function(e){if(e.key==='Escape')mbg.classList.remove('open');});

  var ro=new ResizeObserver(function(){cancelAnimationFrame(raf);initBubbles();loop();});
  initBubbles();ro.observe(stage);loop();
})();
</script>

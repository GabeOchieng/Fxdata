services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://kazi:secret@db:5432/kazihub
      REDIS_URL: redis://redis:6379/0
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-32-characters-min}
      SERVE_FRONTEND: "true"
      FRONTEND_DIR: /frontend
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      WA_TOKEN: ${WA_TOKEN:-}
      WA_PHONE_ID: ${WA_PHONE_ID:-}
    depends_on: [db, redis]
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q default,notifications
    environment:
      DATABASE_URL: postgresql+psycopg2://kazi:secret@db:5432/kazihub
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    volumes:
      - ./backend:/app

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kazihub
      POSTGRES_USER: kazi
      POSTGRES_PASSWORD: secret
    volumes: [pg_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]

volumes:
  pg_data:

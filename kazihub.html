<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaziHub — Kenya Skills Market</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04070f;
  --bg2:#080d1a;
  --surface:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.08);
  --text:#dde3f0;
  --muted:#4a5470;
  --accent:#00ffb3;
  --gold:#ffbe00;

  /* industry palette — saturated, distinct */
  --tech:#00d4ff;
  --beauty:#ff3d9a;
  --food:#ff6b2b;
  --home:#7c5cff;
  --edu:#00ffb3;
  --events:#ffd000;
  --transport:#2b8fff;
  --health:#ff3d5a;
  --construction:#ff8c00;
  --creative:#c94dff;
  --finance:#00d26a;
  --security:#6a8aaa;
  --wellness:#ff5fa0;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* starfield */
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(1px 1px at 15% 20%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 42% 8%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 73% 15%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 88% 45%,rgba(255,255,255,.25) 0%,transparent 100%),
    radial-gradient(1px 1px at 28% 72%,rgba(255,255,255,.35) 0%,transparent 100%),
    radial-gradient(1px 1px at 62% 88%,rgba(255,255,255,.2) 0%,transparent 100%),
    radial-gradient(1px 1px at 5% 55%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 95% 75%,rgba(255,255,255,.25) 0%,transparent 100%),
    radial-gradient(2px 2px at 50% 50%,rgba(0,212,255,.08) 0%,transparent 70%),
    radial-gradient(2px 2px at 80% 20%,rgba(124,92,255,.06) 0%,transparent 60%);
  pointer-events:none;
}

/* ── NAV ── */
nav{
  position:relative;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;
  background:rgba(4,7,15,.9);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.logo{
  font-family:'Space Grotesk',sans-serif;
  font-size:18px;font-weight:700;letter-spacing:-.3px;
  display:flex;align-items:center;gap:8px;
}
.logo-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent);
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
.logo em{color:var(--accent);font-style:normal;}

.nav-stats{display:flex;gap:16px;font-size:11px;}
.ns{color:var(--muted);}
.ns b{color:var(--text);font-weight:600;}
.ns .live{color:#00ff88;}

.nav-r{display:flex;gap:8px;}
.btn{
  padding:7px 16px;border-radius:8px;
  font-family:'Space Grotesk',sans-serif;
  font-size:12px;font-weight:600;cursor:pointer;border:none;
  transition:all .15s;
}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-prime{background:var(--accent);color:#04070f;font-weight:700;}
.btn-prime:hover{box-shadow:0 0 16px rgba(0,255,179,.4);transform:translateY(-1px);}

/* ── TICKER ── */
.ticker-wrap{
  flex-shrink:0;
  overflow:hidden;
  background:rgba(8,13,26,.8);
  border-bottom:1px solid var(--border);
  padding:6px 0;
}
.ticker-inner{
  display:flex;gap:36px;white-space:nowrap;
  animation:ticker 60s linear infinite;
}
.ti{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.ti b{color:var(--text);}
.up{color:#00ffb3;} .dn{color:#ff3d5a;}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── MAIN LAYOUT ── */
.main{
  flex:1;display:flex;overflow:hidden;position:relative;z-index:1;
}

/* ── CANVAS ── */
.canvas-shell{
  flex:1;position:relative;overflow:hidden;
  background:rgba(2,5,12,0.7);
}
#kc{display:block;width:100%;height:100%;cursor:default;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}

/* cursor: drawn on canvas only — no DOM bleed */

/* ── CONTROLS (float over canvas) ── */
.float-controls{
  position:absolute;top:14px;left:14px;z-index:20;
  display:flex;flex-direction:column;gap:8px;
}
.search-box{
  position:relative;
}
.search-box input{
  width:260px;padding:8px 12px 8px 32px;
  background:rgba(8,13,26,.88);
  border:1px solid var(--border);
  border-radius:9px;color:var(--text);
  font-size:12px;font-family:'Space Grotesk',sans-serif;
  outline:none;backdrop-filter:blur(12px);
  transition:border-color .18s;
}
.search-box input:focus{border-color:var(--accent);}
.search-box input::placeholder{color:var(--muted);}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;}

.cat-filters{display:flex;gap:5px;flex-wrap:wrap;max-width:340px;}
.cf{
  padding:4px 10px 4px 8px;border-radius:99px;font-size:10px;font-weight:600;
  cursor:pointer;border:1px solid var(--border);
  background:rgba(8,13,26,.85);color:var(--muted);
  transition:all .15s;white-space:nowrap;backdrop-filter:blur(8px);
  display:inline-flex;align-items:center;gap:5px;
}
.cf:hover{color:var(--text);border-color:rgba(255,255,255,.18);}
.cf.on{border-color:transparent;color:#04070f;}
.cf-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  opacity:0.65;transition:opacity .15s, transform .15s;
}
.cf:hover .cf-dot{opacity:1;}
.cf.on .cf-dot{opacity:1;transform:scale(1.2);}
.cf[data-cat="all"] .cf-dot{display:none;}

/* ── SIDE PANEL ── */
.side{
  width:300px;flex-shrink:0;
  border-left:1px solid var(--border);
  background:rgba(4,7,15,.92);
  display:flex;flex-direction:column;
  overflow:hidden;
  backdrop-filter:blur(20px);
}

.side-head{
  padding:12px 14px 0;
  border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:0;
}
.side-tabs{display:flex;gap:0;}
.stab{
  flex:1;padding:10px 6px;text-align:center;
  font-size:11px;font-weight:600;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent;
  transition:all .15s;
}
.stab.on{color:var(--accent);border-bottom-color:var(--accent);}

.side-body{flex:1;overflow-y:auto;padding:12px;}
.side-body::-webkit-scrollbar{width:3px;}
.side-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* leaderboard row */
.lr{
  display:flex;align-items:center;gap:9px;
  padding:7px 8px;border-radius:8px;cursor:pointer;
  transition:background .12s;margin-bottom:2px;
}
.lr:hover{background:rgba(255,255,255,.04);}
.lrk{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--muted);width:18px;flex-shrink:0;}
.lrk.g{color:var(--gold);}
.lav{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#04070f;font-weight:700;
}
.li{flex:1;min-width:0;}
.ln{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ls{font-size:10px;color:var(--muted);}
.lval{font-size:11px;font-weight:700;}

/* ── SLIDERS PANEL ── */
.sliders-section{padding:10px 14px;}
.sl-title{
  font-size:9px;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);margin-bottom:10px;
}
.sl-row{
  display:flex;align-items:center;gap:8px;margin-bottom:9px;
}
.sl-emoji{font-size:13px;width:18px;flex-shrink:0;}
.sl-label{font-size:10px;font-weight:600;flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sl-val{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:600;
  width:28px;text-align:right;flex-shrink:0;
}
input[type=range]{
  flex:1;height:3px;cursor:pointer;
  -webkit-appearance:none;appearance:none;
  background:var(--border);border-radius:2px;outline:none;
  max-width:80px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:12px;height:12px;border-radius:50%;
  cursor:pointer;transition:transform .1s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.3);}

/* ── TOOLTIP ── */
.tt{
  position:fixed;pointer-events:none;z-index:500;
  background:rgba(8,13,26,.95);
  border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;
  box-shadow:0 16px 48px rgba(0,0,0,.8);
  opacity:0;transition:opacity .1s;
  min-width:200px;max-width:240px;
  backdrop-filter:blur(20px);
}
.tt.show{opacity:1;}
.tt-name{font-size:14px;font-weight:700;margin-bottom:3px;}
.tt-cat{font-size:10px;color:var(--muted);margin-bottom:10px;}
.tt-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}
.tt-row span:last-child{font-weight:600;font-family:'JetBrains Mono',monospace;}
.tt-prog{margin-top:10px;}
.tt-prog-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px;}
.tt-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.tt-fill{height:100%;border-radius:2px;}
.tt-lvl{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:99px;
  font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;margin-top:8px;border:1px solid;
}

/* ── MODAL ── */
.modal-bg{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.82);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal-box{
  background:var(--bg2);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:28px;
  width:min(540px,92vw);max-height:86vh;
  overflow-y:auto;
  transform:translateY(16px);transition:transform .2s;
}
.modal-bg.open .modal-box{transform:translateY(0);}
.modal-box::-webkit-scrollbar{width:3px;}
.modal-box::-webkit-scrollbar-thumb{background:var(--border);}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.mtitle{font-size:22px;font-weight:700;}
.mclose{
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--muted);width:30px;height:30px;border-radius:50%;
  cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.mclose:hover{color:var(--text);}
.mstats{
  display:flex;border:1px solid var(--border);
  border-radius:12px;overflow:hidden;margin-bottom:18px;
}
.mst{flex:1;padding:14px;text-align:center;border-right:1px solid var(--border);}
.mst:last-child{border-right:none;}
.mst .mv{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.mst .ml{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

.wcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.wcard{
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-radius:12px;padding:12px;
  cursor:pointer;transition:all .15s;
}
.wcard:hover{border-color:var(--accent);background:rgba(0,255,179,.04);transform:translateY(-2px);}
.wc-av{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#04070f;margin-bottom:8px;
}
.wc-name{font-size:12px;font-weight:600;margin-bottom:2px;}
.wc-loc{font-size:10px;color:var(--muted);margin-bottom:6px;}
.wc-stars{font-size:11px;color:var(--gold);margin-bottom:5px;}
.wc-chip{
  display:inline-flex;padding:2px 8px;border-radius:99px;
  font-size:9px;font-weight:700;border:1px solid;
  text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;
}
.xpbar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-bottom:2px;}
.xpfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:2px;}
.wc-xplbl{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:4px;}
.wc-wa{font-size:11px;font-weight:600;color:#25d366;display:flex;align-items:center;gap:4px;margin-top:5px;}

.join-box{
  background:linear-gradient(135deg,rgba(0,255,179,.08),rgba(255,190,0,.04));
  border:1px solid rgba(0,255,179,.15);border-radius:14px;
  padding:20px;text-align:center;
}
.join-box h4{font-size:15px;font-weight:700;margin-bottom:8px;}
.join-box p{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6;}
.jfield{margin-bottom:12px;}
.jfield label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.jfield input,.jfield select{
  width:100%;padding:10px 12px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:9px;
  color:var(--text);font-family:'Space Grotesk',sans-serif;
  font-size:13px;outline:none;transition:border-color .15s;
}
.jfield input:focus,.jfield select:focus{border-color:var(--accent);}
.jfield select option{background:var(--bg2);}
.udrop{
  border:2px dashed var(--border);border-radius:12px;
  padding:22px;text-align:center;cursor:pointer;transition:all .18s;
}
.udrop:hover{border-color:var(--accent);background:rgba(0,255,179,.04);}
.udrop .ui{font-size:26px;margin-bottom:8px;}
.udrop p{font-size:11px;color:var(--muted);line-height:1.5;}

/* ── LEGEND BAR ── */
/* legend removed — colour key lives in filter pills */

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ── COLLAPSIBLE TOP CHROME ──────────────────────────────── */
#top-chrome{
  flex-shrink:0;
  overflow:hidden;
  max-height:200px;
  transition:max-height .38s cubic-bezier(.4,0,.2,1),
             opacity .25s ease;
  opacity:1;
}
#top-chrome.collapsed{
  max-height:0;
  opacity:0;
}

/* reveal tab — sits at very top of canvas, hidden until chrome collapses */
.top-reveal-tab{
  position:absolute;top:0;left:50%;transform:translateX(-50%) translateY(-100%);
  z-index:30;
  background:rgba(4,7,15,.9);
  border:1px solid var(--border);
  border-top:none;
  border-radius:0 0 10px 10px;
  padding:3px 18px 5px;
  cursor:pointer;
  color:var(--muted);
  transition:transform .38s cubic-bezier(.4,0,.2,1), color .15s;
  backdrop-filter:blur(12px);
  display:flex;align-items:center;
}
.top-reveal-tab:hover{ color:var(--text); }
/* slide into view when chrome collapses — .main is sibling of #top-chrome */
#top-chrome.collapsed ~ .main .top-reveal-tab{
  transform:translateX(-50%) translateY(0);
}

/* ── COLLAPSIBLE SIDE PANEL ──────────────────────────────── */
#side-panel{
  position:relative;
  width:300px;
  transition:width .38s cubic-bezier(.4,0,.2,1);
  overflow:hidden;   /* clips content during slide */
  flex-shrink:0;
}
#side-panel.collapsed{
  width:0;
}

/* toggle button — rides the left edge */
.side-toggle{
  /* sits in .main (position:relative), rides the right edge of canvas / left edge of side */
  position:absolute;
  top:50%;
  right:0;                          /* will be overridden by JS based on side width */
  transform:translateY(-50%);
  z-index:40;
  background:rgba(4,7,15,.92);
  border:1px solid var(--border);
  border-right:none;
  border-radius:10px 0 0 10px;
  width:18px;height:42px;
  cursor:pointer;
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  transition:color .15s, background .15s;
  padding:0;
  backdrop-filter:blur(14px);
  outline:none;
}
.side-toggle:hover{ color:var(--text); background:rgba(8,13,26,.99); }
#side-toggle-icon{
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
/* arrow flips when side is collapsed */
#side-panel.collapsed ~ .side-toggle #side-toggle-icon,
.side-toggle.flipped #side-toggle-icon{
  transform:rotate(180deg);
}

/* ── THEME SWITCHER ──────────────────────────────────────── */
.theme-bar{
  position:absolute;bottom:44px;right:14px;z-index:25;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;
}
.theme-pill{
  display:flex;align-items:center;
  background:rgba(4,7,15,.88);
  border:1px solid var(--border);
  border-radius:99px;
  backdrop-filter:blur(14px);
  overflow:hidden;
  font-size:10px;font-weight:700;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.tpill-opt{
  padding:5px 13px;cursor:pointer;
  color:var(--muted);letter-spacing:.3px;
  transition:all .18s;user-select:none;
}
.tpill-opt.active{
  background:var(--accent);color:#04070f;
  border-radius:99px;margin:2px;
}
.tpill-opt:hover:not(.active){ color:var(--text); }

/* icon style picker */
.icon-pill{
  display:flex;align-items:center;gap:0;
  background:rgba(4,7,15,.88);
  border:1px solid var(--border);
  border-radius:99px;
  backdrop-filter:blur(14px);
  overflow:hidden;
  font-size:10px;font-weight:700;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.icon-pill span{
  padding:4px 11px;cursor:pointer;
  color:var(--muted);
  transition:all .18s;user-select:none;
}
.icon-pill span.active{
  background:rgba(255,255,255,.1);color:var(--text);
  border-radius:99px;margin:2px;
}
.icon-pill span:hover:not(.active){ color:var(--text); }

/* heatmap mode body tint */
body.heatmap-mode .canvas-shell{
  background:rgba(1,3,8,0.82);
}


/* ── KAZIHUB CHATBOT ──────────────────────────────────────── */
#kh-chat-btn{
  position:fixed;bottom:22px;right:22px;z-index:200;
  width:52px;height:52px;border-radius:50%;
  background:var(--accent,#00ffb3);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 24px rgba(0,255,179,.35);
  transition:transform .2s, box-shadow .2s;
  font-size:22px;
}
#kh-chat-btn:hover{transform:scale(1.08);box-shadow:0 6px 32px rgba(0,255,179,.5);}
#kh-chat-btn .kh-chat-unread{
  position:absolute;top:-2px;right:-2px;
  width:16px;height:16px;border-radius:50%;
  background:#ff3d5a;color:#fff;
  font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
#kh-chat-btn .kh-chat-unread.show{opacity:1;}
#kh-chat-panel{
  position:fixed;bottom:86px;right:22px;z-index:200;
  width:340px;max-height:520px;
  background:rgba(6,10,22,.97);
  border:1px solid rgba(255,255,255,.10);
  border-radius:18px;
  display:flex;flex-direction:column;
  box-shadow:0 16px 60px rgba(0,0,0,.7);
  backdrop-filter:blur(24px);
  transform:scale(.9) translateY(12px);
  opacity:0;pointer-events:none;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), opacity .18s;
  overflow:hidden;
}
#kh-chat-panel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all;}
.kh-chat-head{
  padding:14px 16px 12px;
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.kh-chat-avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#00ffb3,#00d4ff);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;
}
.kh-chat-title{font-size:13px;font-weight:700;color:#f0eee8;}

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rndF(a,b){return parseFloat((a+Math.random()*(b-a)).toFixed(1));}

// Industry sliders (multiplier 0.5x to 3x, default 1x)
var catScale = {};
Object.keys(CATS).forEach(function(k){ catScale[k]=1.0; });

var DATA = RAW.map(function(r){
  var workers = rnd(5,400);
  var jobs    = rnd(30,3200);
  var reviews = rnd(10,1400);
  var rating  = rndF(3.5,5.0);
  var growth  = rndF(-12,60);
  // Wide XP range — creates genuinely different bubble sizes
  // Use a power distribution so most are small, a few are huge (like crypto)
  var rawXP = Math.pow(Math.random(), 1.8) * 10000;
  var cxp   = Math.min(10000, Math.floor(rawXP + workers*8 + jobs*0.8));
  var color = CATS[r.cat] ? CATS[r.cat].color : '#888';
  return {
    id:r.id, label:r.label, cat:r.cat, emoji:r.emoji,
    workers:workers, jobs:jobs, reviews:reviews,
    rating:rating, growth:growth,
    communityXP:cxp, level:getLevel(cxp), color:color,
    baseR:0 // calculated below
  };
});

// ── VIEWPORT-AWARE AUTO SIZING ─────────────────────────────────
// Target: bubble circles fill ~68% of canvas area (like Coin360).
// avg_r = sqrt(canvas_area * 0.68 / N / π)  — recalculated on resize.
// Each bubble gets a multiplier from 0.52× (smallest) to 2.6× (largest)
// using a compressed power curve so the spread feels natural, not extreme.
// Sort ascending XP → assign multiplier → store as baseMultiplier.
// Actual pixel radius = baseMultiplier * computedAvgR  (see currentR()).
var FILL_RATIO = 0.52;  // 52% — enough air between solid discs
var MIN_MULT   = 0.42;  // smallest bubble (emoji-only at these sizes)
var MAX_MULT   = 2.05;  // largest bubble — capped so no single bubble dominates
var CURVE      = 1.9;   // steep curve: many smalls, few larges (Coin360 shape)

var sorted4R = DATA.slice().sort(function(a,b){return a.communityXP-b.communityXP;});
sorted4R.forEach(function(d,i){
  var pct = i / (sorted4R.length - 1);           // 0 → 1
  var mult = MIN_MULT + Math.pow(pct, CURVE) * (MAX_MULT - MIN_MULT);
  d.baseMultiplier = mult;
  d.baseR = 20; // placeholder — overwritten in initBubbles
});


// ── EMOJI TEXTURE CACHE ──────────────────────────────────────────────────
// Pre-render each unique emoji once to an offscreen canvas.
// drawImage() of a cached canvas is a GPU texture blit — ~100× faster
// than re-rasterizing a color emoji glyph via ctx.fillText() every frame.
var emojiCache = {};
var EMOJI_CACHE_SIZE = 64; // px — high-res source, scaled down at draw time

function buildEmojiCache(){
  var seen = {};
  DATA.forEach(function(d){
    if(seen[d.emoji]) return;
    seen[d.emoji] = true;
    var oc  = document.createElement('canvas');
    oc.width = oc.height = EMOJI_CACHE_SIZE;
    var octx = oc.getContext('2d');
    // Clear to transparent
    octx.clearRect(0, 0, EMOJI_CACHE_SIZE, EMOJI_CACHE_SIZE);
    // Draw emoji centred, at full cache size
    var fs = Math.round(EMOJI_CACHE_SIZE * 0.72);
    octx.font = fs + 'px serif';
    octx.textAlign    = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(d.emoji, EMOJI_CACHE_SIZE/2, EMOJI_CACHE_SIZE/2 + fs*0.04);
    emojiCache[d.emoji] = oc;
  });
}

// Helper: draw a cached emoji centred at (cx,cy) with given pixel size
function drawCachedEmoji(emoji, cx, cy, size, alpha){
  var bmp = emojiCache[emoji];
  if(!bmp) return;
  ctx.globalAlpha = alpha;
  var half = size / 2;
  ctx.drawImage(bmp, cx - half, cy - half, size, size);
}

// Compute the average radius for current canvas dimensions
function computeAvgR(W, H){
  var area = W * H * FILL_RATIO;
  return Math.sqrt(area / DATA.length / Math.PI);
}

var canvas=document.getElementById('kc');
var ctx=canvas.getContext('2d');
var shell=document.getElementById('cshell');
var tt=document.getElementById('tt');
var BUBBLES=[];
var hovB=null,dragB=null,dragOX=0,dragOY=0,wasDrag=false;
var raf, activeFilter='all', searchQ='';

function hexRgba(hex,a){
  // handle 3 or 6 char hex
  var h=hex.replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r=parseInt(h.slice(0,2),16);
  var g=parseInt(h.slice(2,4),16);
  var b=parseInt(h.slice(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function currentR(b){
  var avgR = computeAvgR(canvas.width || shell.clientWidth, canvas.height || shell.clientHeight);
  var sc   = catScale[b.d.cat] || 1;
  // clamp so tiny bubbles are still touchable (min 8px) and giant ones don't swallow screen
  var minR = Math.max(8,  avgR * MIN_MULT * 0.7);
  var maxR = Math.min(avgR * MAX_MULT * 1.1, Math.min(canvas.width, canvas.height) * 0.22);
  return Math.min(maxR, Math.max(minR, b.d.baseMultiplier * avgR * sc));
}

// ── VENT ANIMATION STATE ─────────────────────────────────────
// Each bubble has a "rising" phase before normal physics takes over
// rising: true  → bubble is still floating up from the bottom
// riseTarget: {x, y} → final resting position
// riseT: 0→1 animation progress
// riseDelay: frames to wait before this bubble starts rising
// wobbleAmp / wobbleFreq: sinusoidal horizontal drift during rise

function initBubbles(){
  var W=shell.clientWidth, H=shell.clientHeight;
  canvas.width=W; canvas.height=H;

  var avgR = computeAvgR(W, H);

  DATA.forEach(function(d){
    var sc = catScale[d.cat] || 1;
    d.baseR = Math.max(8, d.baseMultiplier * avgR * sc);
  });

  // Pre-compute final resting positions with separation passes
  var targets = DATA.map(function(d){
    var r = Math.max(8, d.baseMultiplier * avgR);
    return { d:d, x: rnd(r+8, W-r-8), y: rnd(r+8, H-r-8), r:r };
  });
  for(var pass=0; pass<140; pass++){
    for(var i=0; i<targets.length; i++){
      for(var j=i+1; j<targets.length; j++){
        var a=targets[i], b=targets[j];
        var dx=b.x-a.x, dy=b.y-a.y;
        var d2=dx*dx+dy*dy;
        var minD=a.r+b.r+3;
        if(d2<minD*minD&&d2>0.001){
          var dist=Math.sqrt(d2);
          var nx=dx/dist, ny=dy/dist;
          var ov=(minD-dist)*0.5;
          a.x-=nx*ov; a.y-=ny*ov;
          b.x+=nx*ov; b.y+=ny*ov;
          // clamp
          a.x=Math.max(a.r+4,Math.min(W-a.r-4,a.x));
          a.y=Math.max(a.r+4,Math.min(H-a.r-4,a.y));
          b.x=Math.max(b.r+4,Math.min(W-b.r-4,b.x));
          b.y=Math.max(b.r+4,Math.min(H-b.r-4,b.y));
        }
      }
    }
  }

  // Sort targets by x so vents feel like columns rising
  targets.sort(function(a,b){ return a.x - b.x; });

  // Build BUBBLES — each starts below canvas and rises
  BUBBLES = targets.map(function(t, i){
    var r = currentR({d:t.d});
    // stagger columns: left→right over 200 frames, plus small jitter
    var delay = Math.floor(i / targets.length * 200) + Math.floor(Math.random()*30);
    return {
      d: t.d,
      // start below the canvas bottom
      x: t.x + (Math.random()-0.5)*40,
      y: H + r + Math.random()*60,
      vx: 0, vy: 0,
      pulse: Math.random()*Math.PI*2,
      filtered: false,
      r: r,
      // ── vent fields ──
      rising:      true,
      riseTarget:  { x: t.x, y: t.y },
      riseStartY:  H + r + Math.random()*60,
      riseT:       0,           // 0→1 eased progress
      riseDelay:   delay,       // frames before this bubble starts
      riseFrame:   0,           // internal counter
      riseSpeed:   0.0055 + Math.random()*0.003, // ~3-4s rise at 60fps
      wobbleAmp:   (Math.random()*0.6+0.3)*r*0.8, // sway ± fraction of radius
      wobbleFreq:  0.8 + Math.random()*0.6,       // cycles per unit of riseT
      wobblePhase: Math.random()*Math.PI*2,
      scaleT:      0  // scales from 0→1 during rise (pop-in effect)
    };
  });

  cancelAnimationFrame(raf);
  loopFrame=0;
  loop();
}

var loopFrame=0;

// Smooth ease-out cubic
function easeOut(t){ return 1-(1-t)*(1-t)*(1-t); }
// Ease-in-out for size
function easeInOut(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }

function applyFilter(){
  var q=searchQ.toLowerCase();
  BUBBLES.forEach(function(b){
    var catOk=activeFilter==='all'||b.d.cat===activeFilter;
    var srOk=!q||b.d.label.toLowerCase().indexOf(q)>-1||b.d.cat.toLowerCase().indexOf(q)>-1;
    b.filtered=!(catOk&&srOk);
  });
}

function collide(init){
  for(var i=0;i<BUBBLES.length;i++){
    for(var j=i+1;j<BUBBLES.length;j++){
      var a=BUBBLES[i], b=BUBBLES[j];
      var ar=currentR(a), br=currentR(b);
      var dx=b.x-a.x, dy=b.y-a.y;
      var d2=dx*dx+dy*dy;
      var gap=4;
      var minD=ar+br+gap;
      if(d2<minD*minD && d2>0.001){
        var dist=Math.sqrt(d2);
        var nx=dx/dist, ny=dy/dist;
        // init: strong separation; live: very gentle nudge (no velocity spike)
        var push = init ? 0.5 : 0.06;
        var ov=(minD-dist)*push;
        if(a!==dragB){ a.x-=nx*ov; a.y-=ny*ov; }
        if(b!==dragB){ b.x+=nx*ov; b.y+=ny*ov; }
        // no velocity transfer on live — that's what caused the jiggle
      }
    }
  }
}

function clampToBounds(b){
  var W=canvas.width, H=canvas.height;
  var r=currentR(b);
  if(b.x-r<0){b.x=r;b.vx=Math.abs(b.vx);}
  if(b.x+r>W){b.x=W-r;b.vx=-Math.abs(b.vx);}
  if(b.y-r<0){b.y=r;b.vy=Math.abs(b.vy);}
  if(b.y+r>H){b.y=H-r;b.vy=-Math.abs(b.vy);}
}

// ── DRAW ONE BUBBLE (crypto-style glass) ──
function drawB(b, scaleT){
  var d   = b.d;
  var r   = currentR(b);
  var isH = (b === hovB);
  if(scaleT === undefined) scaleT = 1;

  ctx.save();

  // ── Vent scale-in ──────────────────────────────────────────────────────
  if(scaleT < 1){
    ctx.translate(b.x, b.y);
    ctx.scale(scaleT, scaleT);
    ctx.translate(-b.x, -b.y);
  }

  if(b.filtered){
    ctx.globalAlpha = 0.04;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI*2);
    ctx.fillStyle = hexRgba(d.color, 1);
    ctx.fill();
    ctx.restore();
    return;
  }

  if(currentTheme === 'crisp'){
    drawBCrisp(b, d, r, isH, scaleT);
  } else {
    drawBMinimal(b, d, r, isH, scaleT);
  }

  ctx.restore();
}

// ── HEATMAP DRAW ──────────────────────────────────────────────────────────
// Colour = growth %: deep red (#c0392b) → neutral (#2c2c3a) → vivid green (#27ae60)
// Fill: radial gradient for subtle depth (like joshkale.github.io)
// Label: emoji + name + Δ% stacked
function heatColor(growth){
  // clamp to ±50%
  var g = Math.max(-50, Math.min(50, growth));
  if(g >= 0){
    // neutral → green
    var t = g / 50;
    var r = Math.round(44  + (30  - 44)  * t);
    var gC= Math.round(44  + (174 - 44)  * t);
    var bC= Math.round(58  + (96  - 58)  * t);
    return 'rgb('+r+','+gC+','+bC+')';
  } else {
    // neutral → red
    var t = (-g) / 50;
    var r = Math.round(44  + (192 - 44)  * t);
    var gC= Math.round(44  + (57  - 44)  * t);
    var bC= Math.round(58  + (43  - 58)  * t);
    return 'rgb('+r+','+gC+','+bC+')';
  }
}

function drawBCrisp(b, d, r, isH, scaleT){
  // CryptoBubbles-style: vivid full-opacity sphere gradient
  var cx = Math.round(b.x), cy = Math.round(b.y);

  // Sphere gradient: bright highlight top-left → category colour → dark edge
  var grad = ctx.createRadialGradient(
    cx - r*0.30, cy - r*0.30, r*0.02,
    cx, cy, r
  );
  grad.addColorStop(0,    lightenRgb(d.color, 0.50));
  grad.addColorStop(0.45, d.color);
  grad.addColorStop(1,    darkenRgb(d.color, 0.28));

  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = grad; ctx.fill();

  // Subtle dark inner rim for definition
  ctx.beginPath(); ctx.arc(cx, cy, r-0.5, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth=1; ctx.stroke();

  // Hover: bright white rim + outer glow
  if(isH){
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.80)'; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, r+2.5, 0, Math.PI*2);
    ctx.strokeStyle=hexRgba(d.color,0.40); ctx.lineWidth=3.5; ctx.stroke();
  }

  if(iconStyle==='none') return;

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=0; ctx.lineJoin='round';

  function ct(text,tx,ty,col,fs,w,mono){
    var fam=mono?'JetBrains Mono,monospace':'Space Grotesk,sans-serif';
    ctx.font=(w||'700')+' '+fs+'px '+fam;
    ctx.lineWidth=Math.max(2,fs*0.30); ctx.strokeStyle='rgba(0,0,0,0.70)';
    ctx.strokeText(text,Math.round(tx),Math.round(ty));
    ctx.fillStyle=col; ctx.fillText(text,Math.round(tx),Math.round(ty));
  }

  if(r>=38){
    var showE=(iconStyle==='emoji');
    var ey=cy-r*0.25, ny=cy+(showE?r*0.10:0), sy=cy+(showE?r*0.34:r*0.26);
    if(showE){ var es=Math.max(10,r*0.31); drawCachedEmoji(d.emoji,cx,ey,es*1.3,1); }
    var fs=Math.max(7,Math.min(12,r*0.185));
    var mc=Math.max(4,Math.floor(r*1.6/(fs*0.60)));
    var lb=d.label.length>mc?d.label.slice(0,mc-1)+'…':d.label;
    ct(lb,cx,ny,'#ffffff',fs,'700',false);
    if(r>=50) ct(d.workers+' pros',cx,sy,'rgba(255,255,255,0.80)',Math.max(6,fs-2),'600',true);
  } else if(r>=24){
    var showE2=(iconStyle==='emoji');
    if(showE2){ var es2=Math.max(9,r*0.44); drawCachedEmoji(d.emoji,cx,cy-r*0.14,es2*1.3,1); }
    var fs2=Math.max(6,Math.min(10,r*0.20));
    var mc2=Math.max(3,Math.floor(r*1.4/(fs2*0.60)));
    var lb2=d.label.length>mc2?d.label.slice(0,mc2-1)+'…':d.label;
    ct(lb2,cx,showE2?cy+r*0.24:cy,'#ffffff',fs2,'700',false);
  } else if(r>=14&&iconStyle==='emoji'){
    var es3=Math.max(8,r*0.56); drawCachedEmoji(d.emoji,cx,cy,es3*1.3,1);
  }
}

// darken rgb() string
// parse hex or rgb() → [r,g,b]
function parseColor(col){
  var h=col.trim();
  if(h[0]==='#'){
    h=h.slice(1);
    if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
  }
  var m=h.match(/[\d.]+/g);
  return m?[+m[0],+m[1],+m[2]]:[128,128,128];
}
function darkenRgb(col,amt){
  var c=parseColor(col);
  return 'rgb('+Math.round(c[0]*(1-amt))+','+Math.round(c[1]*(1-amt))+','+Math.round(c[2]*(1-amt))+')';
}

function drawBMinimal(b, d, r, isH, scaleT){
  var xpAlpha = Math.min(0.88, Math.max(0.28, 0.30 + (d.communityXP/10000)*0.58));

  // Solid fill — pixel-snapped
  var cx=Math.round(b.x),cy=Math.round(b.y);
  ctx.globalAlpha = xpAlpha;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = d.color;
  ctx.fill();

  // Hover lift
  if(isH){
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = hexRgba('#ffffff', 0.10); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.60)';
    ctx.lineWidth   = 1.5; ctx.stroke();
  }

  // Labels
  if(iconStyle === 'none' || r < 16){ return; }

  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowBlur=0; ctx.lineJoin='round';
  var tAlpha = isH ? 1 : Math.min(1, xpAlpha * 1.75);

  if(r >= 34){
    // large: emoji above + name below
    if(iconStyle === 'emoji'){
      var es = Math.max(9, r * 0.30);
      drawCachedEmoji(d.emoji, cx, cy - r*0.20, es * 1.28, tAlpha * 0.95);
    }
    // name
    var fs  = Math.max(6, Math.min(10, r * 0.165));
    var maxC= Math.max(4, Math.floor(r * 1.55 / (fs * 0.62)));
    var lbl = d.label.length > maxC ? d.label.slice(0, maxC-1)+'…' : d.label;
    ctx.globalAlpha = tAlpha;
    ctx.font      = '600 '+fs+'px Space Grotesk,sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fillText(lbl, b.x, iconStyle==='emoji' ? b.y+r*0.20 : b.y);

  } else if(r >= 22){
    // medium: emoji centred (or text abbreviation)
    if(iconStyle === 'emoji'){
      var es2 = Math.max(9, r * 0.50);
      drawCachedEmoji(d.emoji, b.x, b.y, es2 * 1.28, tAlpha * 0.88);
    } else {
      var fs2  = Math.max(6, r * 0.19);
      var maxC2= Math.max(3, Math.floor(r * 1.3 / (fs2 * 0.62)));
      var lbl2 = d.label.slice(0, maxC2);
      ctx.globalAlpha = tAlpha;
      ctx.font      = '700 '+fs2+'px Space Grotesk,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.80)';
      ctx.fillText(lbl2, b.x, b.y);
    }
  } else if(r >= 14 && iconStyle === 'emoji'){
    var es3 = Math.max(8, r * 0.54);
    drawCachedEmoji(d.emoji, b.x, b.y, es3 * 1.28, tAlpha * 0.75);
  }

  ctx.shadowBlur = 0;
}

// Lighten a rgb() string by mixing toward white
function lightenRgb(col, amt){
  var c=parseColor(col);
  return 'rgb('+Math.round(c[0]+(255-c[0])*amt)+','+Math.round(c[1]+(255-c[1])*amt)+','+Math.round(c[2]+(255-c[2])*amt)+')';
}

// ── CANVAS CURSOR ────────────────────────────────────────────
// No custom ring — native pointer cursor only. Clean.
var canvasMX=-999, canvasMY=-999, canvasHover=false;

function loop(){
  var W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  loopFrame++;

  // ── Draw vent glow sources at bottom (only during entry phase) ──────
  var anyRising = BUBBLES.some(function(b){ return b.rising && b.riseFrame>=b.riseDelay; });
  if(anyRising){
    // find bubbles that are currently rising and draw a vent glow at their x, bottom
    BUBBLES.forEach(function(b){
      if(!b.rising || b.riseFrame < b.riseDelay || b.riseT <= 0) return;
      var ventX = b.riseTarget.x;
      var ventPulse = 0.4 + 0.35*Math.sin(loopFrame*0.08 + b.wobblePhase);
      var vg = ctx.createRadialGradient(ventX, H, 0, ventX, H, 18+b.r*0.3);
      vg.addColorStop(0, hexRgba(b.d.color, 0.18*ventPulse));
      vg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(ventX, H, 18+b.r*0.3, 0, Math.PI*2);
      ctx.fillStyle=vg; ctx.fill();
    });
  }

  var cx=W/2, cy=H/2;
  BUBBLES.forEach(function(b){
    if(b===dragB) return;
    b.r = currentR(b);

    if(b.rising){
      b.riseFrame++;
      // wait for stagger delay before this bubble starts
      if(b.riseFrame < b.riseDelay) return;

      // advance progress 0→1 at riseSpeed per frame
      b.riseT  = Math.min(1, b.riseT  + b.riseSpeed);
      b.scaleT = Math.min(1, b.scaleT + b.riseSpeed * 1.2);

      var et = easeOut(b.riseT);

      // Y: rise from bottom to target — always moving upward
      b.y = b.riseStartY - (b.riseStartY - b.riseTarget.y) * et;

      // X: sinusoidal wobble (underwater bubble left-right drift)
      // amplitude shrinks to zero as it arrives at target
      var wobbleFade = Math.pow(1 - b.riseT, 1.4);
      b.x = b.riseTarget.x
            + Math.sin(b.riseT * 14 * b.wobbleFreq + b.wobblePhase)
            * b.wobbleAmp * wobbleFade;

      if(b.riseT >= 1){
        b.rising = false;
        b.x      = b.riseTarget.x;
        b.y      = b.riseTarget.y;
        b.scaleT = 1;
        b.vx = 0; b.vy = 0;
      }
    } else {
      // Settled drift — Coin360 style nearly-still float
      b.vx += (cx - b.x) * 0.000006;
      b.vy += (cy - b.y) * 0.000006;
      b.vx *= 0.962; b.vy *= 0.962;
      var spd = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
      if(spd > 0.9){ var k=0.9/spd; b.vx*=k; b.vy*=k; }
      b.x += b.vx; b.y += b.vy;
      clampToBounds(b);
    }
  });

  // Collision only on settled bubbles — don't disturb the rising path
  collideMixed();

  // Draw large-to-small
  var sorted=BUBBLES.slice().sort(function(a,b2){return currentR(b2)-currentR(a);});
  sorted.forEach(function(b){ drawB(b, b.scaleT!==undefined ? b.scaleT : 1); });


  raf=requestAnimationFrame(loop);
}

// Collision that works on both rising and settled bubbles (gentler)
function collideMixed(){
  for(var i=0;i<BUBBLES.length;i++){
    for(var j=i+1;j<BUBBLES.length;j++){
      var a=BUBBLES[i],b=BUBBLES[j];
      if(a.rising&&b.rising) continue; // both rising: skip, they target separate spots
      var ar=currentR(a),br=currentR(b);
      var dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
      var minD=ar+br+4;
      if(d2<minD*minD&&d2>0.001){
        var dist=Math.sqrt(d2);
        var nx=dx/dist,ny=dy/dist;
        var ov=(minD-dist)*0.04;
        if(!a.rising&&a!==dragB){a.x-=nx*ov;a.y-=ny*ov;}
        if(!b.rising&&b!==dragB){b.x+=nx*ov;b.y+=ny*ov;}
      }
    }
  }
}

// cursor ring removed — native pointer handles UX

// ── HIT TEST ──
function hitTest(mx,my){
  // check small-first so tiny ones on top are clickable
  var sm=BUBBLES.slice().sort(function(a,b){return currentR(a)-currentR(b);});
  for(var i=0;i<sm.length;i++){
    var b=sm[i]; if(b.filtered) continue;
    var r=currentR(b);
    var dx=mx-b.x, dy=my-b.y;
    if(dx*dx+dy*dy<r*r) return b;
  }
  return null;
}

// ── MOUSE ──
// cursor div removed — drawn on canvas
// global mousemove: cursor handled on canvas only

canvas.addEventListener('mousemove',function(e){
  var rc=canvas.getBoundingClientRect();
  var mx=e.clientX-rc.left, my=e.clientY-rc.top;
  // feed cursor ring
  canvasMX=mx; canvasMY=my;
  if(dragB){dragB.x=mx+dragOX;dragB.y=my+dragOY;wasDrag=true;return;}
  var hit=hitTest(mx,my);
  hovB=hit;
  canvasHover=!!hit;
  if(hit){
    canvas.style.cursor='pointer';
    var d=hit.d;
    document.getElementById('tt-n').textContent=d.emoji+' '+d.label;
    document.getElementById('tt-c').textContent=(CATS[d.cat]?CATS[d.cat].icon+' '+CATS[d.cat].label:d.cat);
    document.getElementById('tt-w').textContent=d.workers;
    document.getElementById('tt-r').textContent='⭐ '+d.rating;
    document.getElementById('tt-j').textContent=d.jobs.toLocaleString();
    var gStr=(d.growth>=0?'+':'')+d.growth+'%';
    document.getElementById('tt-g').textContent=gStr;
    document.getElementById('tt-g').style.color=d.growth>=0?'#00ffb3':'#ff3d5a';
    var f=document.getElementById('tt-f');
    f.style.width=(d.communityXP/10000*100).toFixed(1)+'%';
    f.style.background='linear-gradient(90deg,'+d.level.color+','+d.color+')';
    var lvEl=document.getElementById('tt-lv');
    lvEl.textContent=d.level.name+' · '+d.communityXP.toLocaleString()+' XP';
    lvEl.style.color=d.level.color;
    lvEl.style.borderColor=d.level.color+'44';
    var tx=e.clientX+18, ty=e.clientY-10;
    if(tx+250>window.innerWidth) tx=e.clientX-258;
    if(ty+220>window.innerHeight) ty=e.clientY-224;
    tt.style.left=tx+'px'; tt.style.top=ty+'px';
    tt.classList.add('show');
  } else {
    canvas.style.cursor='default';
    tt.classList.remove('show');
  }
});

canvas.addEventListener('mousedown',function(e){
  var rc=canvas.getBoundingClientRect();
  var hit=hitTest(e.clientX-rc.left,e.clientY-rc.top);
  if(hit){dragB=hit;dragOX=hit.x-(e.clientX-rc.left);dragOY=hit.y-(e.clientY-rc.top);wasDrag=false;}
});

canvas.addEventListener('mouseup',function(){
  if(dragB&&!wasDrag) openCategory(dragB.d);
  if(dragB){dragB.vx=0;dragB.vy=0;dragB=null;}
  wasDrag=false;
});

canvas.addEventListener('mouseleave',function(){
  tt.classList.remove('show'); hovB=null;
  canvas.style.cursor='default';
  canvasHover=false; canvasMX=-999; canvasMY=-999;
});

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  e.stopPropagation();
  // auto-collapse chrome on first canvas touch
  if(!topCollapsed || !sideCollapsed) collapseForCanvas();
  var t=e.touches[0],rc=canvas.getBoundingClientRect();
  var mx=t.clientX-rc.left, my=t.clientY-rc.top;
  var hit=hitTest(mx,my);
  if(hit){
    dragB=hit;
    dragOX=hit.x-mx; dragOY=hit.y-my;
    wasDrag=false;
    hovB=hit;
    // show tooltip on touch
    var d=hit.d;
    document.getElementById('tt-n').textContent=d.emoji+' '+d.label;
    document.getElementById('tt-c').textContent=(CATS[d.cat]?CATS[d.cat].icon+' '+CATS[d.cat].label:d.cat);
    document.getElementById('tt-w').textContent=d.workers;
    document.getElementById('tt-r').textContent='⭐ '+d.rating;
    document.getElementById('tt-j').textContent=d.jobs.toLocaleString();
    var gStr=(d.growth>=0?'+':'')+d.growth+'%';
    document.getElementById('tt-g').textContent=gStr;
    document.getElementById('tt-g').style.color=d.growth>=0?'#00ffb3':'#ff3d5a';
    var f=document.getElementById('tt-f');
    f.style.width=(d.communityXP/10000*100).toFixed(1)+'%';
    f.style.background='linear-gradient(90deg,'+d.level.color+','+d.color+')';
    var lvEl=document.getElementById('tt-lv');
    lvEl.textContent=d.level.name+' · '+d.communityXP.toLocaleString()+' XP';
    lvEl.style.color=d.level.color;
    lvEl.style.borderColor=d.level.color+'44';
    var tx=t.clientX+18, ty=t.clientY-10;
    if(tx+250>window.innerWidth) tx=t.clientX-258;
    if(ty+220>window.innerHeight) ty=t.clientY-224;
    var tt=document.getElementById('tt');
    tt.style.left=tx+'px'; tt.style.top=ty+'px';
    tt.classList.add('show');
  }
},{passive:false});

canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  e.stopPropagation();
  if(!dragB) return;
  var t=e.touches[0],rc=canvas.getBoundingClientRect();
  dragB.x=t.clientX-rc.left+dragOX;
  dragB.y=t.clientY-rc.top+dragOY;
  wasDrag=true;
},{passive:false});

canvas.addEventListener('touchend',function(e){
  e.preventDefault();
  e.stopPropagation();
  var tt=document.getElementById('tt');
  tt.classList.remove('show');
  hovB=null;
  if(dragB&&!wasDrag) openCategory(dragB.d);
  if(dragB){dragB.vx=0;dragB.vy=0;dragB=null;}
  wasDrag=false;
},{passive:false});

canvas.addEventListener('touchcancel',function(e){
  e.preventDefault();
  var tt=document.getElementById('tt');
  tt.classList.remove('show');
  hovB=null;
  if(dragB){dragB.vx=0;dragB.vy=0;dragB=null;}
},{passive:false});

  var html='<div class="sliders-section" style="padding:0;">';

  Object.keys(CATS).forEach(function(k){

function onSlider(cat, val, valId){
  var mult=parseFloat(val)/100;
  catScale[cat]=mult;
  var el=document.getElementById(valId);

}

function resetSliders(){
  Object.keys(CATS).forEach(function(k){
    catScale[k]=1.0;
    var el=document.getElementById('sl_'+k);
    if(el) el.value=100;
    var vel=document.getElementById('slv_'+k);

}

// ================================================================
// COLLAPSE CHROME
// ================================================================
var topCollapsed  = false;
var sideCollapsed = false;

function collapseForCanvas(){
  // Auto-collapse both panels when user starts interacting with bubbles
  if(!topCollapsed)  collapseTop(true);
  if(!sideCollapsed) collapseSide(true);
}

function collapseTop(instant){
  topCollapsed = true;
  var el = document.getElementById('top-chrome');
  if(instant){ el.style.transition='none'; requestAnimationFrame(function(){ el.style.transition=''; }); }
  el.classList.add('collapsed');
  // flip arrow on reveal tab
  var tab = document.getElementById('top-reveal');
  if(tab){ tab.style.transform = 'translateX(-50%) translateY(0)'; }
  // resize canvas after transition
  setTimeout(function(){ cancelAnimationFrame(raf); initBubbles(); }, instant?40:400);
}

function expandTop(){
  topCollapsed = false;
  var el = document.getElementById('top-chrome');
  el.classList.remove('collapsed');
  var tab = document.getElementById('top-reveal');
  if(tab){ tab.style.transform = ''; }
  setTimeout(function(){ cancelAnimationFrame(raf); initBubbles(); }, 400);
}

function toggleTopChrome(){
  if(topCollapsed) expandTop(); else collapseTop(false);
}

function updateTogglePos(){
  var btn = document.getElementById('side-toggle');
  if(!btn) return;
  var panel = document.getElementById('side-panel');
  var w = sideCollapsed ? 0 : (panel ? panel.offsetWidth : 300);
  btn.style.right = w + 'px';
  if(sideCollapsed){ btn.classList.add('flipped'); }
  else             { btn.classList.remove('flipped'); }
}

function collapseSide(instant){
  sideCollapsed = true;
  var el = document.getElementById('side-panel');
  if(instant){
    el.style.transition='none';
    requestAnimationFrame(function(){ el.style.transition=''; });
  }
  el.classList.add('collapsed');
  // move toggle smoothly
  var btn = document.getElementById('side-toggle');
  if(btn){ btn.style.transition = instant ? 'none' : 'right .38s cubic-bezier(.4,0,.2,1), color .15s, background .15s';
           btn.style.right = '0'; btn.classList.add('flipped'); }
  setTimeout(function(){ cancelAnimationFrame(raf); initBubbles(); }, instant?40:400);
}

function expandSide(){
  sideCollapsed = false;
  var el = document.getElementById('side-panel');
  el.classList.remove('collapsed');
  var btn = document.getElementById('side-toggle');
  if(btn){ btn.style.transition = 'right .38s cubic-bezier(.4,0,.2,1), color .15s, background .15s';
           btn.style.right = '300px'; btn.classList.remove('flipped'); }
  setTimeout(function(){ cancelAnimationFrame(raf); initBubbles(); }, 400);
}

function toggleSide(){
  if(sideCollapsed) expandSide(); else collapseSide(false);
}

// Wire canvas mousedown → auto-collapse (desktop)
canvas.addEventListener('mousedown', function(){
  if(!topCollapsed || !sideCollapsed) collapseForCanvas();
});

<!-- KAZIHUB CHATBOT -->
<button id="kh-chat-btn" onclick="khChatToggle()" title="Chat with KaziHub">
  🤖
  <div class="kh-chat-unread" id="kh-unread">1</div>
</button>
<div id="kh-chat-panel">
  <div class="kh-chat-head">
    <div class="kh-chat-avatar">🤖</div>
    <div>
      <div class="kh-chat-title">KaziHub Assistant</div>
      <div class="kh-chat-sub">● Online · Nairobi</div>
    </div>
    <button class="kh-chat-close" onclick="khChatToggle()">✕</button>
  </div>
  <div class="kh-chat-msgs" id="kh-msgs"></div>
  <div class="kh-chips" id="kh-chips"></div>
  <div class="kh-chat-foot">
    <textarea class="kh-chat-input" id="kh-input" rows="1"
      placeholder="Find a plumber, electrician…"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();khSend();}"></textarea>
    <button class="kh-chat-send" id="kh-send-btn" onclick="khSend()">➤</button>
  </div>
</div>
<script>
(function(){
var KH_PANEL,KH_MSGS,KH_INPUT,KH_SEND,KH_CHIPS,KH_UNREAD;
var khOpen=false,khHistory=[],khBusy=false;

function khServiceList(){
  if(typeof DATA!=='undefined'){
    return DATA.slice(0,100).map(function(d){return d.emoji+' '+d.label;}).join(', ');
  }
  return 'Electricians, Plumbers, Carpenters, House Cleaners, Photographers, Web Designers, Tailors, Event Caterers, Drivers, Security Guards, Fitness Trainers, Lawyers, Accountants, Nannies, Barbers, DJs, Plumbers, Masons, Solar Installers, and 240+ more';
}

var KH_SYS='You are KaziHub Assistant — a sharp, friendly AI for KaziHub, Kenya\'s gig economy marketplace in Nairobi.\nKaziHub connects customers with verified local professionals across 259 service categories.\nServices available: '+khServiceList()+'\n\nRules:\n- Keep replies SHORT (2-4 sentences max). No walls of text.\n- When a user describes a need, identify the best matching service and recommend it directly.\n- Always end service recommendations with a WhatsApp CTA on a new line in this exact format: [WA:ServiceName:Neighbourhood]\n  Example: [WA:Electrician:Westlands]\n- Typical prices in KES: small jobs 500-2000, medium 2000-8000, large 8000-50000+.\n- Payment is via M-Pesa STK Push after booking on WhatsApp.\n- If you need more info, ask ONE question only (area or urgency).\n- Never make up specific pro names or phone numbers.\n- If user writes in Swahili, respond in Swahili.';

var STARTERS=['Find me a plumber 🪠','I need an electrician ⚡','House cleaning today 🧹','Event photographer 📸','Graphic designer 🎨'];

function khInit(){
  KH_PANEL=document.getElementById('kh-chat-panel');
  KH_MSGS=document.getElementById('kh-msgs');
  KH_INPUT=document.getElementById('kh-input');
  KH_SEND=document.getElementById('kh-send-btn');
  KH_CHIPS=document.getElementById('kh-chips');
  KH_UNREAD=document.getElementById('kh-unread');
  if(!KH_PANEL)return;
  khAddMsg('bot','Hey! 👋 I\'m your KaziHub assistant. Tell me what service you need and I\'ll match you with a verified pro in Nairobi.');
  STARTERS.forEach(function(s){
    var c=document.createElement('button');
    c.className='kh-chip';c.textContent=s;
    c.onclick=function(){KH_INPUT.value=s;khSend();};
    KH_CHIPS.appendChild(c);
  });
  setTimeout(function(){if(KH_UNREAD)KH_UNREAD.classList.add('show');},2000);
  var inp=document.getElementById('kh-input');
  if(inp){inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px';});}
}

function khChatToggle(){
  if(!KH_PANEL)return;
  khOpen=!khOpen;
  KH_PANEL.classList.toggle('open',khOpen);
  if(khOpen){
    if(KH_UNREAD)KH_UNREAD.classList.remove('show');
    setTimeout(function(){if(KH_INPUT)KH_INPUT.focus();},250);
  }
}

function khAddMsg(role,content){
  if(!KH_MSGS)return null;
  var div=document.createElement('div');
  div.className='kh-msg '+role;
  var html=content.replace(/\[WA:([^\]]+)\]/g,function(_,p){
    var pts=p.split(':'),svc=pts[0]||'service',loc=pts[1]||'Nairobi';
    var msg=encodeURIComponent('Hi, I found you on KaziHub. I need '+svc+' in '+loc+'. Are you available?');
    return '<br><a class="kh-wa-cta" href="https://wa.me/254700000000?text='+msg+'" target="_blank">💬 Book via WhatsApp — '+svc+'</a>';
  });
  html=html.replace(/\n/g,'<br>');
  div.innerHTML=html;
  KH_MSGS.appendChild(div);
  KH_MSGS.scrollTop=KH_MSGS.scrollHeight;
  return div;
}

function khRemove(el){if(el&&el.parentNode)el.parentNode.removeChild(el);}

async function khSend(){
  if(khBusy||!KH_INPUT)return;
  var text=(KH_INPUT.value||'').trim();if(!text)return;
  KH_INPUT.value='';KH_INPUT.style.height='';
  if(KH_CHIPS)KH_CHIPS.innerHTML='';
  khAddMsg('user',text);
  khHistory.push({role:'user',content:text});
  khBusy=true;if(KH_SEND)KH_SEND.disabled=true;
  var thinking=khAddMsg('thinking','● thinking…');
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:300,
        system:KH_SYS,
        messages:khHistory
      })
    });
    var data=await res.json();
    var reply=(data.content&&data.content[0]&&data.content[0].text)||'Sorry, something went wrong. Try again.';
    khRemove(thinking);
    khAddMsg('bot',reply);
    khHistory.push({role:'assistant',content:reply});
    if(khHistory.length>20)khHistory=khHistory.slice(-20);
  }catch(e){
    khRemove(thinking);
    khAddMsg('bot','Connection issue — please try again in a moment.');
  }
  khBusy=false;if(KH_SEND)KH_SEND.disabled=false;if(KH_INPUT)KH_INPUT.focus();
}

window.khChatToggle=khChatToggle;
window.khSend=khSend;
document.addEventListener('DOMContentLoaded',khInit);
})();
</script>
